<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Viral AI Video Editor • Smart Auto-Editor</title>
    <style>
      body { margin: 0; background-color: #020617; }
      #root:empty::after {
        content: 'Initializing AI Editor...';
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        color: #94a3b8; font-family: sans-serif; font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #020617; color: #94a3b8; font-family: sans-serif; text-align: center; padding: 20px;">
        <div>
          <div style="width: 40px; height: 40px; border: 3px solid #1e293b; border-top-color: #8b5cf6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px auto;"></div>
          <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
          <h2 style="font-size: 14px; letter-spacing: 2px; text-transform: uppercase; font-weight: 900;">Preparing AI Editor</h2>
          <p style="font-size: 11px; margin-top: 8px; opacity: 0.7;">Optimizing for iPhone Safari...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
