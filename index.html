<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Viral AI Video Editor • Smart Auto-Editor</title>
    <style>
      body { margin: 0; background-color: #020617; }
      #root:empty::after {
        content: 'Initializing AI Editor...';
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        color: #94a3b8; font-family: sans-serif; font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Diagnostic Error Recovery for Mobile
      window.onerror = function(message, source, lineno, colno, error) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="padding: 40px; color: white; background: #020617; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">' +
            '<div style="font-size: 40px; margin-bottom: 20px;">⚠️</div>' +
            '<h2 style="font-weight: 900; letter-spacing: -0.5px; margin-bottom: 10px;">ENGINE ERROR</h2>' +
            '<div style="background: rgba(255,0,0,0.1); padding: 15px; border-radius: 10px; margin-bottom: 30px;">' +
            '<p style="color: #f43f5e; font-size: 11px; font-family: monospace; word-break: break-all; text-align: left;">' + message + '</p>' +
            '</div>' +
            '<button onclick="location.reload()" style="padding: 14px 28px; background: #8b5cf6; color: white; border: none; border-radius: 16px; font-weight: 800; font-size: 12px; text-transform: uppercase;">Reload Page</button>' +
            '</div>';
        }
        return false;
      };
    </script>
  </body>
</html>
